# Ghost of Yotei PPSA26344 v02.002.000 for AnyPS5's relinker (--patches): RECOMMENDED for playing.
# 1. 1920x1080 output and render size: shahulmubeen-a's 02.002 relinker patch (AnyPS5 discussion #675, comment 19114360).
# 2. Quality ladder row 15: the 17 readers of the game's scalability row become mov r32, 15; nop (DarthPotato).
# 3. RTGI off: the 10 reads of the byte that turns ray-traced GI on read a constant zero instead (DarthPotato). Without it the
#    game stops with 'FATAL: Insufficient RTGI memory' in some areas (e.g. the Snake's house) even with ray tracing off in
#    the menu, and AnyKyty cannot translate an RTGI compute shader anyway.
# va is the ELF virtual address in the unwrapped eboot (tools/unwrap_self.py eboot.bin eboot.elf).
# Unwrapped eboot sha256 519f5661708514d04ab2dd3e6ce889f8d3b2b315d13eac3f4124edd656d96376.
format = 1

[[patch]]
name     = "out_size_init"
description = "init: movabs rcx, (2160<<32)|3840 -> (1080<<32)|1920 (output/target size)"
target   = "eboot.elf"
va       = 0xdde5e5
expected = "48b9000f000070080000"
value    = "48b98007000038040000"

[[patch]]
name     = "out_width_check"
description = "per-frame update: mov edx, 3840 -> 1920 (size differs -> reset path)"
target   = "eboot.elf"
va       = 0xde020b
expected = "ba000f0000"
value    = "ba80070000"

[[patch]]
name     = "out_height_check"
description = "per-frame update: xor esi, 2160 -> 1080"
target   = "eboot.elf"
va       = 0xde021f
expected = "81f670080000"
value    = "81f638040000"

[[patch]]
name     = "out_size_reset"
description = "reset path: movabs rdx, (2160<<32)|3840 -> (1080<<32)|1920"
target   = "eboot.elf"
va       = 0xde0271
expected = "48ba000f000070080000"
value    = "48ba8007000038040000"

[[patch]]
name     = "drs_table"
description = "16-step dynamic-resolution table (w,h pairs, 3840x2160 .. 1920x1080) -> all 16 steps 1920x1080"
target   = "eboot.elf"
va       = 0x1af8190
expected = "000f000070080000800e000028080000000e0000e0070000800d000098070000000d000050070000800c000008070000000c0000c0060000800b000078060000000b000030060000800a0000e8050000000a0000a00500008009000058050000000900001005000080080000c804000000080000800400008007000038040000"
value    = "8007000038040000800700003804000080070000380400008007000038040000800700003804000080070000380400008007000038040000800700003804000080070000380400008007000038040000800700003804000080070000380400008007000038040000800700003804000080070000380400008007000038040000"

