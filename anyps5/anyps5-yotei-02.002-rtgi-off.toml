name     = "rtgi_off_11064ba"
description = "cmp byte [rip+rtgi_flag], 1 -> cmp byte [rip+const_zero], 1"
target   = "eboot.elf"
va       = 0x11064ba
expected = "803defbb2b0401"
value    = "803da581940001"

