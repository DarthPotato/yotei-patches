# Ghost of Yotei PPSA26344 v02.002.000: keep RTGI (ray-traced global illumination) off.
# The game reads one byte (app+0x53c20b0) to decide whether RTGI runs; when it is set, RTGI asks for a 364 MB arena block
# (FATAL: Insufficient RTGI memory with the 1080p patch) and AnyKyty then fails on an RTGI compute shader. These 10 sites are
# every rip-relative read of that byte (cmp byte [rip+flag], imm8); each now reads a constant zero byte instead. By DarthPotato. Verified 10/10 with --verify-patches.
format = 1

[[patch]]
name     = "rtgi_off_11062d4"
description = "cmp byte [rip+rtgi_flag], 1 -> cmp byte [rip+const_zero], 1"
target   = "eboot.elf"
va       = 0x11062d4
expected = "803dd5bd2b0401"
value    = "803d8b83940001"

